name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Types
        run: mypy src tests
      - name: Tests
        run: pytest -q

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for the API health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "service is healthy after $attempt attempts"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Check dashboard, metrics and Prometheus
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q "Market Data Service"
          curl -fsS http://127.0.0.1:8000/metrics | grep -q "mds_ws_connected"
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:9090/-/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs prometheus
          exit 1
      - name: Stop
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down -v
