name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Format
        run: ruff format --check src tests scripts
      - name: Types
        run: mypy src tests scripts
      - name: Tests
        run: pytest -q

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose config -q
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for the API health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "service is healthy after $attempt attempts"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Check dashboard, metrics and Prometheus
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q "Market Data Service"
          curl -fsS http://127.0.0.1:8000/metrics | grep -q "mds_ws_connected"
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:9090/-/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs prometheus
          exit 1
      - name: Stop
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down -v

  clone-validation:
    name: fresh clone validation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - name: Clone the public repository into a temporary directory
        run: |
          rm -rf "$RUNNER_TEMP/mds-clone"
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/mds-clone"
          cd "$RUNNER_TEMP/mds-clone"
          git checkout "$GITHUB_SHA"
          test -f docs/dashboard.png
          test -f tests/fixtures/agg_trades.jsonl
          git status --short
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Full suite from the clone
        working-directory: ${{ runner.temp }}/mds-clone
        run: |
          python -m pip install -e ".[dev]"
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy src tests scripts
          pytest -q
      - name: Compose from the clone
        working-directory: ${{ runner.temp }}/mds-clone
        run: |
          docker compose config -q
          docker compose up -d --build
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "clone is healthy after $attempt attempts"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Check the clone dashboard and metrics
        working-directory: ${{ runner.temp }}/mds-clone
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q "Market Data Service"
          curl -fsS http://127.0.0.1:8000/metrics | grep -q "mds_write_lag_seconds"
      - name: Stop the clone stack
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/mds-clone" ]; then
            cd "$RUNNER_TEMP/mds-clone"
            docker compose logs --no-color || true
            docker compose down -v || true
          fi

  publish:
    name: publish GHCR image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [quality, clone-validation]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ikerabad/market-data-service
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Try to make the GHCR package public
        continue-on-error: true
        run: |
          status=$(curl -sS -o /tmp/ghcr-visibility.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/market-data-service \
            -d '{"visibility":"public"}')
          echo "visibility HTTP $status"
          cat /tmp/ghcr-visibility.json
          test "$status" = "200" -o "$status" = "204"
